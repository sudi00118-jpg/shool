<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students Management | Future Hope</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

.header{
    background:#102a43;
    color:white;
    padding:16px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:19px;
    font-weight:bold;
}

.back{
    background:#f7c948;
    color:#102a43;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    padding:25px 5%;
}

.title{
    background:linear-gradient(135deg,#102a43,#1d4e89);
    color:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:25px;
}

.title h1{
    margin-bottom:8px;
}

.form-box,
.list-box{
    background:white;
    padding:25px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

h2{
    color:#102a43;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#344054;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    padding:13px 20px;
    border-radius:8px;
    background:#102a43;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:18px;
}

button:hover{
    background:#1d4e89;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#eef4fa;
    color:#102a43;
}

.action-btn{
    padding:7px 10px;
    margin:2px;
    font-size:12px;
}

.delete{
    background:#d92d20;
}

.empty{
    text-align:center;
    color:#667085;
    padding:20px;
}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        padding:20px 4%;
    }

    .form-box,
    .list-box{
        padding:18px;
    }

    table{
        font-size:12px;
    }

    th,td{
        padding:9px 5px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🏫 Future Hope School
    </div>

    <a href="admin.html" class="back">
        ← Admin
    </a>

</header>


<div class="container">

    <div class="title">

        <h1>👨‍🎓 Students Management</h1>

        <p>
            የተማሪዎች መመዝገቢያና ማስተዳደሪያ
        </p>

    </div>


    <!-- ADD STUDENT -->

    <div class="form-box">

        <h2>➕ Add New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <div>
                    <label>Student ID</label>
                    <input
                        type="text"
                        id="studentId"
                        placeholder="e.g. FH-1001"
                        required
                    >
                </div>


                <div>
                    <label>Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Student full name"
                        required
                    >
                </div>


                <div>
                    <label>Grade</label>

                    <select id="grade" required>

                        <option value="">Select Grade</option>
                        <option>Grade 9</option>
                        <option>Grade 10</option>
                        <option>Grade 11</option>
                        <option>Grade 12</option>

                    </select>

                </div>


                <div>
                    <label>Gender</label>

                    <select id="gender" required>

                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>

                    </select>

                </div>


                <div>
                    <label>Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="09XXXXXXXX"
                    >

                </div>


                <div>
                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Student password"
                        required
                    >

                </div>

            </div>


            <button type="submit">
                💾 Save Student
            </button>

        </form>

    </div>


    <!-- STUDENT LIST -->

    <div class="list-box">

        <h2>👨‍🎓 Student List</h2>

        <div id="studentList"></div>

    </div>

</div>


<script>

let students =
JSON.parse(localStorage.getItem("futureHopeStudents")) || [];


function displayStudents(){

    let list = document.getElementById("studentList");

    if(students.length === 0){

        list.innerHTML =
        '<div class="empty">No students registered yet.</div>';

        return;
    }


    let html = `

    <div style="overflow-x:auto">

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>

    `;


    students.forEach((student,index)=>{

        html += `

        <tr>

            <td>${student.id}</td>

            <td>${student.name}</td>

            <td>${student.grade}</td>

            <td>${student.gender}</td>

            <td>${student.phone || "-"}</td>

            <td>

                <button
                    class="action-btn delete"
                    onclick="deleteStudent(${index})">
                    Delete
                </button>

            </td>

        </tr>

        `;

    });


    html += `

    </table>

    </div>

    `;

    list.innerHTML = html;
}


document
.getElementById("studentForm")
.addEventListener("submit",function(e){

    e.preventDefault();


    let student = {

        id:
        document.getElementById("studentId").value,

        name:
        document.getElementById("name").value,

        grade:
        document.getElementById("grade").value,

        gender:
        document.getElementById("gender").value,

        phone:
        document.getElementById("phone").value,

        password:
        document.getElementById("password").value

    };


    students.push(student);

    localStorage.setItem(
        "futureHopeStudents",
        JSON.stringify(students)
    );


    alert("✅ Student successfully added!");

    document.getElementById("studentForm").reset();

    displayStudents();

});


function deleteStudent(index){

    if(confirm("Are you sure you want to delete this student?")){

        students.splice(index,1);

        localStorage.setItem(
            "futureHopeStudents",
            JSON.stringify(students)
        );

        displayStudents();

    }

}


displayStudents();

</script>

</body>
</html>
