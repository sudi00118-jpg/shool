<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መግቢያ (Login) | የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-card h2 { color: #064e3b; text-align: center; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #047857; }
        
        /* 👨‍🎓 የወላጅ/ተማሪ ግባ በተን */
        .btn-login { width: 100%; background: #047857; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.3s; margin-bottom: 10px; }
        .btn-login:hover { background: #065f46; }

        .divider { border-top: 1px solid #e2e8f0; margin: 20px 0; position: relative; text-align: center; }
        .divider span { background: #ffffff; padding: 0 10px; color: #94a3b8; font-size: 12px; position: relative; top: -10px; }

        /* 👨‍🏫 የመምህራን መግቢያ በተን */
        .btn-teacher { width: 100%; background: #0284c7; color: white; padding: 11px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-bottom: 15px; }
        .btn-teacher:hover { background: #0369a1; }

        .register-link { text-align: center; font-size: 14px; color: #64748b; }
        .register-link a { color: #047857; font-weight: 600; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h2><i class="fa-solid fa-school"></i> የትምህርት ቤት መግቢያ</h2>
    
    <!-- 1. የወላጅ/ተማሪ መግቢያ ፎርም -->
    <div class="form-group">
        <label for="loginName">የተማሪው ሙሉ ስም</label>
        <input type="text" id="loginName" class="form-control" placeholder="ምሳሌ፦ አቤል ከበደ">
    </div>

    <div class="form-group">
        <label for="loginPhone">የወላጅ ስልክ ቁጥር</label>
        <input type="tel" id="loginPhone" class="form-control" placeholder="0912345678">
    </div>

    <!-- 🟢 የወላጅ/ተማሪ ግባ በተን -->
    <button onclick="loginUser()" id="loginBtn" class="btn-login">የወላጅ/ተማሪ ግባ</button>

    <div class="divider"><span>ወይም</span></div>

    <!-- 🔵 የመምህራን መግቢያ በተን (ወደ teacher-login.html የሚወስድ) -->
    <a href="teacher-login.html" class="btn-teacher">
        <i class="fa-solid fa-chalkboard-user"></i>
        <span>የመምህር መግቢያ (Teacher Login)</span>
    </a>

    <!-- 📝 ወደ ሪጅስትሬሽን የሚወስድ ሊንክ -->
    <div class="register-link">
        አካውንት የለዎትም? <a href="register.html">እዚህ ይመዝገቡ (Register)</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
async function loginUser() {
    const studentName = document.getElementById('loginName').value.trim();
    let parentPhone = document.getElementById('loginPhone').value.trim();
    const loginBtn = document.getElementById('loginBtn');

    if (!studentName || !parentPhone) {
        alert("እባክዎን የተማሪውን ስም እና የወላጅ ስልክ ቁጥር ያስገቡ!");
        return;
    }

    if (parentPhone.startsWith("+251")) {
        parentPhone = "0" + parentPhone.slice(4);
    } else if (parentPhone.startsWith("251")) {
        parentPhone = "0" + parentPhone.slice(3);
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> በመፈተሽ ላይ...';

    try {
        const { data: students, error } = await supabaseClient
            .from('students')
            .select('*')
            .eq('name', studentName)
            .eq('parent_phone', parentPhone);

        if (error) throw error;

        if (students && students.length > 0) {
            alert(`እንኳን ደህና መጡ! ተማሪ ${students[0].name} (ክፍል ${students[0].grade}) በስኬት ገብተዋል።`);
        } else {
            alert("የተሳሳተ ስም ወይም የስልክ ቁጥር! እባክዎን መጀመሪያ ይመዝገቡ።");
        }

    } catch (err) {
        console.error("Login Error:", err);
        alert("ለመግባት ሲሞከር ስህተት ተከሰተ፦ " + err.message);
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'የወላጅ/ተማሪ ግባ';
    }
}
</script>

</body>
</html>
