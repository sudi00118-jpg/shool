<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #102a43; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); text-align: center; }
        .school-title { color: #102a43; font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .school-sub { color: #627d98; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 14px; font-weight: bold; color: #334e68; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #bcccdc; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #2563eb; }
        .btn-login { width: 100%; background: #102a43; color: white; border: 0; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-login:hover { background: #243b53; }
        #alertMsg { margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="school-title">🏫 የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</div>
    <div class="school-sub">📍 አዋሽ 40 (Awash 40) | Portal Login</div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email Address (ኢሜይል)</label>
            <input type="email" id="loginEmail" placeholder="e.g. user@school.com" required>
        </div>
        <div class="form-group">
            <label>Password (የይለፍ ቃል)</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login" id="submitBtn">Sign In (ግባ)</button>
    </form>

    <div id="alertMsg"></div>
</div>

<!-- Supabase SDK Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
async function handleLogin(e) {
    e.preventDefault();
    
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const alertMsg = document.getElementById("alertMsg");
    const submitBtn = document.getElementById("submitBtn");

    alertMsg.style.color = "#102a43";
    alertMsg.textContent = "⏳ Logging in...";
    submitBtn.disabled = true;

    try {
        // 1. Supabase Auth Login
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;

        if (data.user) {
            // 2. Fetch User Profile & Role from Supabase DB
            const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', data.user.id)
                .single();

            if (profileError) {
                // If profile is not found, fallback to user_metadata
                const userRole = data.user.user_metadata?.role || 'student';
                redirectUser(userRole);
            } else {
                redirectUser(profile.role);
            }
        }
    } catch (err) {
        alertMsg.style.color = "#d92d20";
        alertMsg.textContent = "❌ Error: " + err.message;
        submitBtn.disabled = false;
    }
}

function redirectUser(role) {
    const alertMsg = document.getElementById("alertMsg");
    alertMsg.style.color = "#16a34a";
    alertMsg.textContent = "✅ Success! Redirecting...";

    setTimeout(() => {
        if (role === 'admin') {
            window.location.href = 'admin.html';
        } else if (role === 'teacher') {
            window.location.href = 'teacher.html';
        } else if (role === 'parent') {
            window.location.href = 'parent.html';
        } else {
            window.location.href = 'student.html';
        }
    }, 1000);
}
</script>

</body>
</html>
