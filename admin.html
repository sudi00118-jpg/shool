<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Future Hope School</title>

  <!-- Supabase CDN & JS Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background: #f4f7fb; color: #172033; padding: 20px; }
    .header { background: #102a43; color: white; padding: 17px 5%; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 20px; }
    .container { max-width: 800px; margin: auto; }
    .form-card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-card h2 { margin-bottom: 15px; color: #102a43; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #102a43; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #243b53; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🎓 Future Hope School - Admin Dashboard</h2>
  </div>

  <div class="container">
    <!-- የተማሪ መመዝገቢያ Form -->
    <div class="form-card">
      <h2>አዲስ ተማሪ መመዝገቢያ</h2>
      <form id="studentForm">
        <div class="form-group">
          <label>የተማሪ ስም:</label>
          <input type="text" id="studentName" placeholder="ምሳሌ፡ አበበ ከበደ" required>
        </div>
        <div class="form-group">
          <label>ክፍል:</label>
          <input type="text" id="studentGrade" placeholder="ምሳሌ፡ Grade 10" required>
        </div>
        <button type="submit">ተማሪ መዝግብ</button>
      </form>
    </div>

    <!-- የመምህር መመዝገቢያ Form -->
    <div class="form-card">
      <h2>አዲስ መምህር መመዝገቢያ</h2>
      <form id="teacherForm">
        <div class="form-group">
          <label>የመምህር ስም:</label>
          <input type="text" id="teacherName" placeholder="ምሳሌ፡ መምህር አሰፋ" required>
        </div>
        <div class="form-group">
          <label>የሚያስተምሩት ትምህርት:</label>
          <input type="text" id="teacherSubject" placeholder="ምሳሌ፡ Mathematics" required>
        </div>
        <button type="submit">መምህር መዝግብ</button>
      </form>
    </div>
  </div>

</body>
</html>
