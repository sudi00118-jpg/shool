<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተማሪ ገጽ | የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .student-card { width: 100%; max-width: 420px; background: #ffffff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #047857; }
        .student-card h2 { color: #064e3b; text-align: center; margin-bottom: 20px; font-size: 22px; }
        
        .info-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .info-label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 16px; color: #1e293b; font-weight: 600; }

        .btn-logout { width: 100%; background: #ef4444; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.3s; margin-top: 15px; }
        .btn-logout:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="student-card">
    <h2><i class="fa-solid fa-user-graduate"></i> የተማሪ መረጃ ገጽ</h2>
    
    <div class="info-box">
        <div class="info-label">የተማሪው ሙሉ ስም</div>
        <div class="info-value" id="stName">---</div>
    </div>

    <div class="info-box">
        <div class="info-label">ክፍል (Grade)</div>
        <div class="info-value" id="stGrade">---</div>
    </div>

    <div class="info-box">
        <div class="info-label">የወላጅ ስልክ ቁጥር</div>
        <div class="info-value" id="stPhone">---</div>
    </div>

    <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> ውጣ (Logout)</button>
</div>

<script>
    // Login ያደረገው ተማሪ መረጃ ከ LocalStorage ላይ ማውጣት
    const studentData = JSON.parse(localStorage.getItem('loggedInStudent'));

    if (!studentData) {
        // መረጃው ከሌለ ወደ login.html ይመልሰዋል
        window.location.replace("login.html");
    } else {
        // የተማሪውን መረጃ በገጹ ላይ ማሳየት
        document.getElementById('stName').innerText = studentData.name || 'አልተገኘም';
        document.getElementById('stGrade').innerText = studentData.grade ? studentData.grade + "ኛ ክፍል" : 'አልተገኘም';
        document.getElementById('stPhone').innerText = studentData.parent_phone || 'አልተገኘም';
    }

    function logout() {
        localStorage.removeItem('loggedInStudent');
        window.location.replace("login.html");
    }
</script>

</body>
</html>
