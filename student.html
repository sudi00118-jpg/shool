<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | Future Hope School</title>

  <!-- Supabase CDN & JS Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background: #f4f7fb; color: #172033; padding: 20px; }
    .header { background: #102a43; color: white; padding: 17px 5%; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 20px; }
    .container { max-width: 800px; margin: auto; }
    .list-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .list-card h2 { margin-bottom: 15px; color: #102a43; }
    .student-item { background: #eef2f7; padding: 12px; margin-bottom: 10px; border-radius: 5px; border-left: 5px solid #102a43; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🎓 Future Hope School - Student Portal</h2>
  </div>

  <div class="container">
    <div class="list-card">
      <h2>የተመዘገቡ ተማሪዎች ዝርዝር</h2>
      <!-- ዳታው በ Supabase በኩል እዚህ ቦታ ይገባል -->
      <div id="studentList">
        <p>ዳታ እየጫነ ነው...</p>
      </div>
    </div>
  </div>

</body>
</html>
