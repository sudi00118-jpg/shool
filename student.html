<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተማሪ ፖርታል | የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; color: #334155; padding-bottom: 40px; }
        
        header { background: #047857; color: white; padding: 20px; text-align: center; position: relative; }
        header h1 { font-size: 18px; font-weight: 600; }
        header p { font-size: 12px; margin-top: 4px; opacity: 0.9; }
        .btn-logout { position: absolute; right: 15px; top: 18px; background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        /* School Info Banner */
        .school-banner { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; border-top: 4px solid #047857; }
        .school-icon { background: #dcfce7; color: #047857; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .school-details h2 { font-size: 16px; color: #064e3b; margin-bottom: 2px; }
        .school-details p { font-size: 12px; color: #64748b; }

        /* Profile Card */
        .profile-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid #047857; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .profile-info h3 { color: #064e3b; font-size: 18px; margin-bottom: 4px; }
        .profile-info p { font-size: 14px; color: #64748b; }
        .badge { background: #dcfce7; color: #166534; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }

        /* Edit Form inside Profile */
        .edit-form { background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #e2e8f0; display: none; }
        .edit-form h4 { font-size: 14px; margin-bottom: 10px; color: #0f172a; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #475569; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        .btn-save { background: #047857; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-toggle { background: #e2e8f0; color: #334155; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

        /* Sections */
        .section-title { font-size: 16px; font-weight: 600; color: #0f172a; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
        .card-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; color: #475569; }

        .announcement-item { background: #f8fafc; border-left: 4px solid #0284c7; padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .announcement-item h4 { color: #0369a1; font-size: 14px; margin-bottom: 4px; }
        .announcement-item p { font-size: 13px; color: #475569; }
    </style>
</head>
<body>

<header>
    <h1>የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</h1>
    <p>የተማሪዎች መረጃ ማዕከል እና ፖርታል</p>
    <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> ውጣ</button>
</header>

<div class="container">
    
    <!-- የትምህርት ቤት ሙሉ መረጃ (School Info Banner) -->
    <div class="school-banner">
        <div class="school-icon">
            <i class="fa-solid fa-school"></i>
        </div>
        <div class="school-details">
            <h2>የነገው ተስፋ ሁለተኛ ደረጃ ት/ቤት</h2>
            <p><i class="fa-solid fa-location-dot"></i> አዋሽ አርባ (አፋር ክልል) | ጥራት ያለው ትምህርት ለተሻለ ትውልድ</p>
        </div>
    </div>

    <!-- የተማሪ መረጃ ፕሮፋይል ካርድ -->
    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-info">
                <h3 id="stName">በመጫን ላይ...</h3>
                <p><i class="fa-solid fa-phone"></i> ስልክ፦ <span id="stPhone">---</span></p>
            </div>
            <div>
                <span class="badge" id="stGrade" style="margin-right: 10px;">---</span>
                <button onclick="toggleEditForm()" class="btn-toggle"><i class="fa-solid fa-pen-to-square"></i> አስተካክል</button>
            </div>
        </div>

        <!-- መረጃ መቀየሪያ ፎርም -->
        <div id="editFormSection" class="edit-form">
            <h4>መረጃዎችን ማስተካከያ</h4>
            <div class="form-group">
                <label>የወላጅ ስልክ ቁጥር</label>
                <input type="tel" id="editPhone">
            </div>
            <div class="form-group">
                <label>አዲስ ፓስወርድ (Password)</label>
                <input type="password" id="editPass" placeholder="አዲስ ፓስወርድ ካፈለጉ ይጻፉ">
            </div>
            <button onclick="updateProfile()" class="btn-save">ለውጦችን መዝግብ</button>
        </div>
    </div>

    <!-- የትምህርት ፕሮግራም (Timetable) -->
    <div class="section-title"><i class="fa-solid fa-calendar-days"></i> የትምህርት ፕሮግራም (Timetable)</div>
    <div class="card-box">
        <table>
            <thead>
                <tr>
                    <th>ቀን</th>
                    <th>ትምህርት</th>
                    <th>ሰዓት</th>
                </tr>
            </thead>
            <tbody id="timetableBody">
                <tr><td colspan="3" style="text-align:center;">መረጃ በመጫን ላይ...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ማስታወቂያዎች -->
    <div class="section-title"><i class="fa-solid fa-bullhorn"></i> ትምህርት ቤት ማስታወቂያዎች</div>
    <div class="card-box" id="announcementsBox">
        <p style="text-align:center; color:#64748b;">ምንም ማስታወቂያ የለም</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    let studentData = JSON.parse(localStorage.getItem('loggedInStudent'));

    if (!studentData) {
        window.location.replace("login.html");
    } else {
        displayStudentData();
        loadTimetable();
        loadAnnouncements();
    }

    function displayStudentData() {
        document.getElementById('stName').innerText = studentData.name;
        document.getElementById('stGrade').innerText = studentData.grade + "ኛ ክፍል";
        document.getElementById('stPhone').innerText = studentData.parent_phone;
        document.getElementById('editPhone').value = studentData.parent_phone;
    }

    function toggleEditForm() {
        const form = document.getElementById('editFormSection');
        form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    async function updateProfile() {
        const newPhone = document.getElementById('editPhone').value.trim();
        const newPass = document.getElementById('editPass').value.trim();

        if (!newPhone) {
            alert("ስልክ ቁጥር ባዶ ሊሆን አይችልም!");
            return;
        }

        let updateData = { parent_phone: newPhone };
        if (newPass) updateData.password = newPass;

        try {
            const { error } = await supabaseClient
                .from('students')
                .update(updateData)
                .eq('id', studentData.id);

            if (error) throw error;

            studentData.parent_phone = newPhone;
            if (newPass) studentData.password = newPass;
            localStorage.setItem('loggedInStudent', JSON.stringify(studentData));

            alert("መረጃው በተሳካ ሁኔታ ተስተካክሏል!");
            displayStudentData();
            toggleEditForm();
        } catch (err)  {
            alert("ስህተት፦ " + err.message);
        }
    }

    async function loadTimetable() {
        try {
            const { data, error } = await supabaseClient
                .from('timetable')
                .select('*');

            if (error) throw error;

            const tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${item.day || '-'}</b></td>
                            <td>${item.subject || '-'}</td>
                            <td>${item.time || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ምንም የክፍል ፕሮግራም አልተካተተም</td></tr>';
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function loadAnnouncements() {
        try {
            const { data, error } = await supabaseClient
                .from('announcements')
                .select('*');

            if (error) throw error;

            const box = document.getElementById('announcementsBox');
            if (data && data.length > 0) {
                box.innerHTML = '';
                data.forEach(item => {
                    box.innerHTML += `
                        <div class="announcement-item">
                            <h4>${item.title || 'ማስታወቂያ'}</h4>
                            <p>${item.content || ''}</p>
                        </div>
                    `;
                });
            } else {
                box.innerHTML = '<p style="text-align:center; color:#64748b;">ምንም ማስታወቂያ የለም</p>';
            }
        } catch (err) {
            console.error(err);
            document.getElementById('announcementsBox').innerHTML = '<p style="text-align:center; color:#64748b;">ምንም ማስታወቂያ የለም</p>';
        }
    }

    function logout() {
        localStorage.removeItem('loggedInStudent');
        window.location.replace("login.html");
    }
</script>

</body>
</html>
