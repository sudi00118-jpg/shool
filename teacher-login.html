<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የመምህራን መግቢያ | የነገው ተስፋ የ2ኛ ደረጃ ትምህርት ቤት</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #0284c7; }
        .login-card h2 { color: #0369a1; text-align: center; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #0284c7; }
        .btn-teacher { width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.3s; margin-top: 10px; }
        .btn-teacher:hover { background: #0369a1; }
        .back-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .back-link a { color: #64748b; text-decoration: none; }
        .back-link a:hover { color: #0284c7; }
    </style>
</head>
<body>

<div class="login-card">
    <h2><i class="fa-solid fa-chalkboard-user"></i> የመምህራን መግቢያ</h2>
    <p class="subtitle">የመምህራን ፖርታል መግቢያ ገጽ</p>
    
    <div class="form-group">
        <label for="teacherEmail">ኢሜይል (Email)</label>
        <input type="email" id="teacherEmail" class="form-control" placeholder="teacher@gmail.com" required>
    </div>

    <div class="form-group">
        <label for="teacherPassword">ፓስወርድ (Password)</label>
        <input type="password" id="teacherPassword" class="form-control" placeholder="******" required>
    </div>

    <button onclick="loginTeacher()" id="teacherBtn" class="btn-teacher">መምህር ሆኜ ግባ</button>

    <div class="back-link">
        <a href="login.html"><i class="fa-solid fa-arrow-left"></i> ወደ ወላጅ/ተማሪ መግቢያ ተመለስ</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
async function loginTeacher() {
    const email = document.getElementById('teacherEmail').value.trim();
    const password = document.getElementById('teacherPassword').value.trim();
    const teacherBtn = document.getElementById('teacherBtn');

    if (!email || !password) {
        alert("እባክዎን ኢሜይል እና ፓስወርድ ያስገቡ!");
        return;
    }

    teacherBtn.disabled = true;
    teacherBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> በመፈተሽ ላይ...';

    try {
        const { data: teacher, error } = await supabaseClient
            .from('teachers')
            .select('*')
            .eq('email', email)
            .eq('password', password);

        if (error) throw error;

        if (teacher && teacher.length > 0) {
            // የመምህሩን መረጃ ማስቀመጥ
            localStorage.setItem('loggedInTeacher', JSON.stringify(teacher[0]));
            
            alert(`እንኳን ደህና መጡ መምህር ${teacher[0].name}!`);
            
            // 🎯 ቀጥታ ወደ teacher.html ገጽህ መውሰጃ
            window.location.href = "teacher.html";
        } else {
            alert("የተሳሳተ ኢሜይል ወይም ፓስወርድ! እባክዎን ድጋሚ ይሞክሩ።");
        }

    } catch (err) {
        console.error("Teacher Login Error:", err);
        alert("ለመግባት ሲሞከር ስህተት ተከሰተ፦ " + err.message);
    } finally {
        teacherBtn.disabled = false;
        teacherBtn.innerHTML = 'መምህር ሆኜ ግባ';
    }
}
</script>

</body>
</html>
